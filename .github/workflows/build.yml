# Build MB-System (no graphical tools) on Windows (MSVC), Linux (GCC) and
# macOS (Clang, Homebrew dependencies).
#
# Windows dependencies (GMT, GDAL, PROJ, NetCDF, FFTW, pthreads-win32,
# getopt-win32, GLib) come from conda-forge. The paths that ConfigUser.cmake
# hard-codes for the local machine are passed here as -D options instead;
# ConfigUser.cmake is not used in CI.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the InteractiveGMT plugin archives to the mbsystem-latest release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mbdeps
          init-shell: powershell
          cache-environment: true
          create-args: >-
            gmt
            libgdal
            proj
            libnetcdf
            fftw
            pthreads-win32
            getopt-win32
            glib
            cmake
            ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          $L = "$env:CONDA_PREFIX\Library" -replace '\\', '/'
          # conda-forge pthreads-win32 ships pthread.lib (import lib of pthreadVSE2.dll);
          # getopt-win32 ships getopt.lib.
          $pthread = "$L/lib/pthread.lib"
          $getopt  = "$L/lib/getopt.lib"
          foreach ($f in $pthread, $getopt) {
            if (-not (Test-Path $f)) {
              Get-ChildItem "$L/lib" -Filter *.lib | ForEach-Object { $_.Name }
              throw "$f not found"
            }
          }
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$L" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/mbsystem" `
            -DbuildGUIs=OFF `
            -DbuildOpenCV=OFF `
            -DbuildTRN=ON `
            -DbuildTests=ON `
            -DGMT_INCLUDE_DIR="$L/include/gmt" `
            -DGMT_LIBRARY="$L/lib/gmt.lib" `
            -DPSL_LIBRARY="$L/lib/postscriptlight.lib" `
            -DNetCDF_INCLUDE_DIR="$L/include" `
            -DGETOPT_INCLUDE_DIR="$L/include" `
            -DGETOPT_LIBRARY="$getopt" `
            -DPTHREADINC="$L/include" `
            -DPTHREADLIB="$pthread" `
            -DGLIB_INCLUDE_DIR="$L/include/glib-2.0" `
            -DGLIB_CONFIG_DIR="$L/lib/glib-2.0/include" `
            -DGLIB_LIBRARY="$L/lib/glib-2.0.lib"

      - name: Build
        shell: pwsh
        # -k 0: keep going after errors so one run reports every failure.
        run: cmake --build build-ci --parallel -- -k 0

      - name: Install
        shell: pwsh
        run: cmake --install build-ci --prefix "${{ github.workspace }}/mbsystem"

      - name: Make package self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}\mbsystem"
          $bin  = "$root\bin"
          $L    = "$env:CONDA_PREFIX\Library"

          # MB-System installs its own DLLs to lib/, but Windows only finds
          # DLLs next to the executable (or on PATH).
          Copy-Item "$root\lib\*.dll" $bin -Force
          # googletest DLLs are only used by the unit tests.
          Remove-Item "$bin\gtest*.dll", "$bin\gmock*.dll" -ErrorAction SilentlyContinue
          # gmt.exe runs the MB-System GMT modules in mbsystem.dll.
          Copy-Item "$L\bin\gmt.exe" $bin

          # Copy every DLL the executables and DLLs in bin/ depend on,
          # recursively, from the conda environment (conda keeps the MSVC
          # runtime in the environment root). Windows system DLLs are not
          # found there and are skipped.
          $search = @("$L\bin", $env:CONDA_PREFIX)
          $seen   = @{}
          $queue  = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem "$bin\*" -Include *.exe, *.dll | ForEach-Object {
            $seen[$_.Name.ToLower()] = $true
            $queue.Enqueue($_.FullName)
          }
          $added = 0
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            foreach ($line in (dumpbin /nologo /dependents $file)) {
              if ($line -notmatch '^\s+(\S+\.dll)\s*$') { continue }
              $name = $Matches[1]
              $key  = $name.ToLower()
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true
              if ($key -match '^(api-ms-|ext-ms-|ucrtbase)') { continue }
              foreach ($dir in $search) {
                $src = Join-Path $dir $name
                if (Test-Path $src) {
                  Copy-Item $src $bin
                  $queue.Enqueue((Join-Path $bin $name))
                  $added++
                  break
                }
              }
            }
          }
          Write-Host "Copied $added dependency DLLs into bin/"

          # Runtime data: GMT defaults, PROJ database, GDAL data.
          foreach ($d in 'gmt', 'proj', 'gdal') {
            if (Test-Path "$L\share\$d") {
              Copy-Item "$L\share\$d" "$root\share\$d" -Recurse -Force
            }
          }

          @"
          MB-System for Windows x64 (built by GitHub Actions, commit ${{ github.sha }})

          All programs are in bin\ together with the DLLs they need.
          Add bin\ to PATH, or run the programs from there.

          If GMT, PROJ or GDAL cannot find their data files, set:
            GMT_SHAREDIR = <this folder>\share\gmt
            PROJ_DATA    = <this folder>\share\proj
            GDAL_DATA    = <this folder>\share\gdal

          To run the MB-System GMT modules with the bundled gmt.exe, point GMT
          at the plugin, e.g. in gmt.conf:
            GMT_CUSTOM_LIBS = <this folder>\bin\mbsystem.dll
          "@ | Set-Content "$root\README-windows.txt" -Encoding utf8

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-windows-x64
          path: mbsystem
          if-no-files-found: error

  linux:
    name: Linux (GCC, Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gmt libgmt-dev libgdal-dev libproj-dev libnetcdf-dev \
            libfftw3-dev libtirpc-dev

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DbuildGUIs=OFF \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=ON

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # The binaries have /usr/local compiled in (library RPATH, data file
      # locations), so the package holds a /usr/local tree. A tarball keeps
      # the executable bits that the artifact zip would drop.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          tar -czf mbsystem-linux-x64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-linux-x64
          path: mbsystem-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (Clang, arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install cmake ninja gmt gdal proj netcdf fftw

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DbuildGUIs=OFF \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=ON

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # Same /usr/local layout as the Linux package.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          tar -czf mbsystem-macos-arm64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-macos-arm64
          path: mbsystem-macos-arm64.tar.gz
          if-no-files-found: error

  # The MB-System GMT supplement (mbsystem.so / mbsystem.dylib) for InteractiveGMT, on Linux and
  # macOS. It is loaded into a Julia process where GMT.jl has already loaded GMT_jll's libgmt and
  # its GDAL/PROJ/netCDF/FFTW, so it is linked against exactly those (resolved through GMT.jl, i.e.
  # the GMT_jll version users get) and ships only MB-System's own libraries. Linking against apt or
  # Homebrew GMT instead would put a second GMT/GDAL/PROJ into that process.
  #
  # Relocatable ($ORIGIN / @loader_path): the archive unpacks to mbsystem/ anywhere, e.g. under
  # the InteractiveGMT root, which then sets GMT_CUSTOM_LIBS to mbsystem/lib/mbsystem.{so,dylib}.
  #
  # Linux runs on ubuntu-22.04 on purpose: glibc 2.35 + gcc 11, the same floor InteractiveGMT's
  # own Linux library has and the gcc GMT_jll is built with. Never ubuntu-latest.
  plugin:
    name: GMT plugin for InteractiveGMT (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # needed only by the publish step
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-22.04,   julia_arch: x64}
          - {name: macos-arm64,  os: macos-14,       julia_arch: aarch64}
          - {name: macos-x86_64, os: macos-15-intel, julia_arch: x64}

    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build pkg-config libtirpc-dev
          else
            brew install ninja
          fi

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          arch: ${{ matrix.julia_arch }}

      # Every library directory GMT_jll brings (its own + GDAL, PROJ, netCDF, FFTW, ...) becomes a
      # CMake prefix.
      - name: Locate GMT_jll and its dependencies
        run: |
          julia -e '
            using Pkg
            Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "jllenv"))
            Pkg.add(["GMT", "GMT_jll"])
            using GMT_jll
            libdirs = unique(filter(isdir, vcat(joinpath(GMT_jll.artifact_dir, "lib"), GMT_jll.LIBPATH_list)))
            function owner(stem)
                for d in libdirs
                    any(f -> startswith(f, stem), readdir(d)) && return dirname(d)
                end
                error("no $stem* in the GMT_jll libraries")
            end
            open(ENV["GITHUB_ENV"], "a") do io
                println(io, "JLL_PREFIXES=", join(unique(dirname.(libdirs)), ";"))
                println(io, "JLL_LIBDIRS=", join(libdirs, ":"))
                println(io, "GMT_PREFIX=", GMT_jll.artifact_dir)
                println(io, "FFTW_PREFIX=", owner("libfftw3."))
                println(io, "NETCDF_PREFIX=", owner("libnetcdf."))
            end
            println("GMT_jll ", pkgversion(GMT_jll), " at ", GMT_jll.artifact_dir)
            foreach(println, libdirs)
          '

      # pkg-config would hand netCDF (and anything else it knows) from the SYSTEM, ahead of the
      # jll prefixes, so it is fenced to a directory holding only libtirpc.pc (Linux), or nothing.
      # GMT's gmt_shore.h includes <netcdf.h>; only the MSVC branch of CMakeLists.txt adds that
      # path, so it is passed here.
      - name: Configure
        run: |
          set -euo pipefail
          pc="$RUNNER_TEMP/pc"; mkdir -p "$pc"
          if [[ $RUNNER_OS == Linux ]]; then
            cp "$(pkg-config --variable=pcfiledir libtirpc)/libtirpc.pc" "$pc/"
            RPATH='$ORIGIN'
            EXTRA=(-DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath-link,$JLL_LIBDIRS")
          else
            RPATH='@loader_path'
            EXTRA=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          export PKG_CONFIG_LIBDIR="$pc" PKG_CONFIG_PATH=
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DbuildGUIs=OFF -DbuildOpenCV=OFF -DbuildTRN=OFF -DbuildQt=OFF -DbuildPCL=OFF -DbuildTests=OFF \
            -DCMAKE_PREFIX_PATH="$JLL_PREFIXES" \
            -DGMT_DIR="$GMT_PREFIX" -DGMT_CONFIG=/usr/bin/true \
            -DFFTW_ROOT="$FFTW_PREFIX" \
            -DCMAKE_C_FLAGS="-I$NETCDF_PREFIX/include" -DCMAKE_CXX_FLAGS="-I$NETCDF_PREFIX/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH="$RPATH" \
            "${EXTRA[@]}"

      # Only the supplement and what it links. The programs would need GMT_jll on their own
      # library path, so they are not built here.
      - name: Build
        run: cmake --build build-ci --target mbsystem -- -k 0

      - name: Stage
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage/mbsystem"
          mkdir -p "$stage/lib" "$stage/share/mbsystem"
          if [[ $RUNNER_OS == Linux ]]; then pat='*.so*'; else pat='*.dylib'; fi
          find build-ci \( -type f -o -type l \) -name "$pat" -exec cp -a {} "$stage/lib/" \;
          cp src/share/LevitusAnnual82.dat src/share/Projections.dat "$stage/share/mbsystem/"
          echo "${{ github.sha }}" > "$stage/MBSYSTEM_COMMIT"
          ls -la "$stage/lib"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      # Every dependency outside our own lib/ must be a GMT_jll library (already in the process at
      # run time) or a base system library. A system netCDF/PROJ/GDAL/GMT is a failed build.
      - name: Check dependencies
        run: |
          set -euo pipefail
          bad=0
          if [[ $RUNNER_OS == Linux ]]; then
            own=$(cd "$STAGE/lib" && ls)
            jll=$(echo "$JLL_LIBDIRS" | tr ':' '\n' | xargs -I{} ls {} 2>/dev/null)
            for f in "$STAGE"/lib/*.so*; do
              [[ -L $f ]] && continue
              echo "== $(basename "$f")"
              for n in $(readelf -d "$f" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
                if grep -qxF "$n" <<< "$own"; then w=own
                elif grep -qxF "$n" <<< "$jll"; then w=jll
                elif [[ $n =~ ^(libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s|libtirpc|ld-linux-x86-64)\.so ]]; then w=system
                else w=BAD; bad=1
                fi
                echo "   $w  $n"
              done
              echo "   GLIBC max: $(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            done
          else
            for f in "$STAGE"/lib/*.dylib; do
              [[ -L $f ]] && continue
              echo "== $(basename "$f")"
              for n in $(otool -L "$f" | tail -n +2 | awk '{print $1}'); do
                case $n in
                  @rpath/*|@loader_path/*|/usr/lib/*|/System/*) echo "   ok   $n" ;;
                  *) echo "   BAD  $n"; bad=1 ;;
                esac
              done
            done
          fi
          exit $bad

      # The real test: load the relocated plugin into GMT.jl the way InteractiveGMT does, and run
      # a module.
      - name: Package + smoke-test through GMT.jl
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/stage" -czf "mbsystem-${{ matrix.name }}.tar.gz" mbsystem
          probe="$RUNNER_TEMP/probe"; mkdir -p "$probe"
          tar -xzf "mbsystem-${{ matrix.name }}.tar.gz" -C "$probe"
          PROBE="$probe/mbsystem" julia --project="$RUNNER_TEMP/jllenv" -e '
            using GMT, Libdl
            lib = joinpath(ENV["PROBE"], "lib", Sys.isapple() ? "mbsystem.dylib" : "mbsystem.so")
            isfile(lib) || error("missing $lib")
            api = GMT.G_API[]
            api == C_NULL && error("GMT.jl has no session")
            GMT.gmtlib_setparameter(api, "GMT_CUSTOM_LIBS", lib)
            ok = GMT.GMT_Call_Module(api, "mbdefaults", GMT.GMT_MODULE_EXIST, C_NULL) == 0
            println("mbdefaults module found: ", ok)
            ok || error("GMT did not load the MB-System supplement")
            gmt("mbdefaults")
            mbio = filter(l -> occursin("libmbio", l), Libdl.dllist())
            println("MBIO in process: ", mbio)
            isempty(mbio) && error("libmbio not loaded")
          '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-${{ matrix.name }}
          path: mbsystem-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      # Manual runs only, and only when the run asks for it. One fixed tag whose files are
      # replaced in place (--clobber), never a new tag per build.
      - name: Publish to the mbsystem-latest release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The three platform jobs can race to create it: a failed create is fine if it now exists.
          gh release view mbsystem-latest -R "$REPO" >/dev/null 2>&1 || \
            gh release create mbsystem-latest -R "$REPO" --prerelease \
              --title "MB-System GMT plugin for InteractiveGMT (rolling)" \
              --notes "MB-System GMT supplement for Linux and macOS, built against GMT_jll." || \
            gh release view mbsystem-latest -R "$REPO" >/dev/null
          gh release upload mbsystem-latest "mbsystem-${{ matrix.name }}.tar.gz" -R "$REPO" --clobber

  # Full Linux build including the Motif/X11 graphical tools (mbedit,
  # mbnavedit, mbvelocitytool, mbgrdviz, mbeditviz, mbnavadjust). Built on
  # Ubuntu 22.04 to match the WSL2 Ubuntu 22.04 it is meant to run on, so the
  # system libraries it links against are the same versions.
  linux-gui:
    name: Linux with GUIs (GCC, Ubuntu 22.04, for WSL2)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gmt libgmt-dev libgdal-dev libproj-dev libnetcdf-dev \
            libfftw3-dev libtirpc-dev \
            libmotif-dev libx11-dev libxt-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DbuildGUIs=ON \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=OFF

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # The binaries have /usr/local compiled in (library RPATH, data file
      # locations), so the package holds a /usr/local tree.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          cat > stage/usr/local/README-wsl.txt <<'TXT'
          MB-System with graphical tools, built for Ubuntu 22.04 (WSL2 on Windows 11).

          1. Install the libraries the programs need (inside WSL):
               sudo apt update
               sudo apt install gmt libgmt6 libgdal30 libproj22 libnetcdf19 \
                 libfftw3-double3 libtirpc3 libxm4 libxt6 libgl1 libglu1-mesa

          2. Unpack this archive into /usr/local and refresh the library cache:
               sudo tar -xzf mbsystem-linux-gui-ubuntu22.04.tar.gz -C /usr/local
               sudo ldconfig

          3. Run a graphical tool, e.g.:
               mbgrdviz
               mbedit
             On Windows 11 the windows open on the Windows desktop (WSLg).
          TXT
          tar -czf mbsystem-linux-gui-ubuntu22.04.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-linux-gui-ubuntu22.04
          path: mbsystem-linux-gui-ubuntu22.04.tar.gz
          if-no-files-found: error

  # Full macOS build including the Motif/X11 graphical tools, with Motif, X11
  # and Mesa (libGL/libGLU) from Homebrew, as build-utils/FindMotif.cmake and
  # FindOpenGL.cmake expect under /opt/homebrew.
  macos-gui:
    name: macOS with GUIs (Clang, arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install cmake ninja gmt gdal proj netcdf fftw \
            openmotif libx11 libxt mesa mesa-glu

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DbuildGUIs=ON \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=OFF

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # Same /usr/local layout as the other Unix packages.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          cat > stage/usr/local/README-macos.txt <<'TXT'
          MB-System with graphical tools for macOS on Apple Silicon (arm64).

          1. Install the libraries the programs need (Homebrew), and XQuartz,
             which displays the X11/Motif windows:
               brew install gmt gdal proj netcdf fftw openmotif libx11 libxt mesa mesa-glu
               brew install --cask xquartz
             Log out and back in once after installing XQuartz.

          2. Unpack this archive into /usr/local:
               sudo mkdir -p /usr/local
               sudo tar -xzf mbsystem-macos-gui-arm64.tar.gz -C /usr/local
             If macOS blocks the programs as downloaded from the internet:
               sudo xattr -dr com.apple.quarantine /usr/local/bin /usr/local/lib

          3. Run a graphical tool, e.g.:
               mbgrdviz
               mbedit
          TXT
          tar -czf mbsystem-macos-gui-arm64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-macos-gui-arm64
          path: mbsystem-macos-gui-arm64.tar.gz
          if-no-files-found: error
