# Build MB-System (no graphical tools) on Windows (MSVC), Linux (GCC) and
# macOS (Clang, Homebrew dependencies).
#
# Windows dependencies (GMT, GDAL, PROJ, NetCDF, FFTW, pthreads-win32,
# getopt-win32, GLib) come from conda-forge. The paths that ConfigUser.cmake
# hard-codes for the local machine are passed here as -D options instead;
# ConfigUser.cmake is not used in CI.

name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mbdeps
          init-shell: powershell
          cache-environment: true
          create-args: >-
            gmt
            libgdal
            proj
            libnetcdf
            fftw
            pthreads-win32
            getopt-win32
            glib
            cmake
            ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          $L = "$env:CONDA_PREFIX\Library" -replace '\\', '/'
          # conda-forge pthreads-win32 ships pthread.lib (import lib of pthreadVSE2.dll);
          # getopt-win32 ships getopt.lib.
          $pthread = "$L/lib/pthread.lib"
          $getopt  = "$L/lib/getopt.lib"
          foreach ($f in $pthread, $getopt) {
            if (-not (Test-Path $f)) {
              Get-ChildItem "$L/lib" -Filter *.lib | ForEach-Object { $_.Name }
              throw "$f not found"
            }
          }
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$L" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/mbsystem" `
            -DbuildGUIs=OFF `
            -DbuildOpenCV=OFF `
            -DbuildTRN=ON `
            -DbuildTests=ON `
            -DGMT_INCLUDE_DIR="$L/include/gmt" `
            -DGMT_LIBRARY="$L/lib/gmt.lib" `
            -DPSL_LIBRARY="$L/lib/postscriptlight.lib" `
            -DNetCDF_INCLUDE_DIR="$L/include" `
            -DGETOPT_INCLUDE_DIR="$L/include" `
            -DGETOPT_LIBRARY="$getopt" `
            -DPTHREADINC="$L/include" `
            -DPTHREADLIB="$pthread" `
            -DGLIB_INCLUDE_DIR="$L/include/glib-2.0" `
            -DGLIB_CONFIG_DIR="$L/lib/glib-2.0/include" `
            -DGLIB_LIBRARY="$L/lib/glib-2.0.lib"

      - name: Build
        shell: pwsh
        # -k 0: keep going after errors so one run reports every failure.
        run: cmake --build build-ci --parallel -- -k 0

      - name: Install
        shell: pwsh
        run: cmake --install build-ci --prefix "${{ github.workspace }}/mbsystem"

      - name: Make package self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ github.workspace }}\mbsystem"
          $bin  = "$root\bin"
          $L    = "$env:CONDA_PREFIX\Library"

          # MB-System installs its own DLLs to lib/, but Windows only finds
          # DLLs next to the executable (or on PATH).
          Copy-Item "$root\lib\*.dll" $bin -Force
          # googletest DLLs are only used by the unit tests.
          Remove-Item "$bin\gtest*.dll", "$bin\gmock*.dll" -ErrorAction SilentlyContinue
          # gmt.exe runs the MB-System GMT modules in mbsystem.dll.
          Copy-Item "$L\bin\gmt.exe" $bin

          # Copy every DLL the executables and DLLs in bin/ depend on,
          # recursively, from the conda environment (conda keeps the MSVC
          # runtime in the environment root). Windows system DLLs are not
          # found there and are skipped.
          $search = @("$L\bin", $env:CONDA_PREFIX)
          $seen   = @{}
          $queue  = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem "$bin\*" -Include *.exe, *.dll | ForEach-Object {
            $seen[$_.Name.ToLower()] = $true
            $queue.Enqueue($_.FullName)
          }
          $added = 0
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            foreach ($line in (dumpbin /nologo /dependents $file)) {
              if ($line -notmatch '^\s+(\S+\.dll)\s*$') { continue }
              $name = $Matches[1]
              $key  = $name.ToLower()
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true
              if ($key -match '^(api-ms-|ext-ms-|ucrtbase)') { continue }
              foreach ($dir in $search) {
                $src = Join-Path $dir $name
                if (Test-Path $src) {
                  Copy-Item $src $bin
                  $queue.Enqueue((Join-Path $bin $name))
                  $added++
                  break
                }
              }
            }
          }
          Write-Host "Copied $added dependency DLLs into bin/"

          # Runtime data: GMT defaults, PROJ database, GDAL data.
          foreach ($d in 'gmt', 'proj', 'gdal') {
            if (Test-Path "$L\share\$d") {
              Copy-Item "$L\share\$d" "$root\share\$d" -Recurse -Force
            }
          }

          @"
          MB-System for Windows x64 (built by GitHub Actions, commit ${{ github.sha }})

          All programs are in bin\ together with the DLLs they need.
          Add bin\ to PATH, or run the programs from there.

          If GMT, PROJ or GDAL cannot find their data files, set:
            GMT_SHAREDIR = <this folder>\share\gmt
            PROJ_DATA    = <this folder>\share\proj
            GDAL_DATA    = <this folder>\share\gdal

          To run the MB-System GMT modules with the bundled gmt.exe, point GMT
          at the plugin, e.g. in gmt.conf:
            GMT_CUSTOM_LIBS = <this folder>\bin\mbsystem.dll
          "@ | Set-Content "$root\README-windows.txt" -Encoding utf8

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-windows-x64
          path: mbsystem
          if-no-files-found: error

  linux:
    name: Linux (GCC, Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gmt libgmt-dev libgdal-dev libproj-dev libnetcdf-dev \
            libfftw3-dev libtirpc-dev

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DbuildGUIs=OFF \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=ON

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # The binaries have /usr/local compiled in (library RPATH, data file
      # locations), so the package holds a /usr/local tree. A tarball keeps
      # the executable bits that the artifact zip would drop.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          tar -czf mbsystem-linux-x64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-linux-x64
          path: mbsystem-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (Clang, arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install cmake ninja gmt gdal proj netcdf fftw

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DbuildGUIs=OFF \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=ON

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # Same /usr/local layout as the Linux package.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          tar -czf mbsystem-macos-arm64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-macos-arm64
          path: mbsystem-macos-arm64.tar.gz
          if-no-files-found: error

  # Full Linux build including the Motif/X11 graphical tools (mbedit,
  # mbnavedit, mbvelocitytool, mbgrdviz, mbeditviz, mbnavadjust). Built on
  # Ubuntu 22.04 to match the WSL2 Ubuntu 22.04 it is meant to run on, so the
  # system libraries it links against are the same versions.
  linux-gui:
    name: Linux with GUIs (GCC, Ubuntu 22.04, for WSL2)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gmt libgmt-dev libgdal-dev libproj-dev libnetcdf-dev \
            libfftw3-dev libtirpc-dev \
            libmotif-dev libx11-dev libxt-dev \
            libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DbuildGUIs=ON \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=OFF

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # The binaries have /usr/local compiled in (library RPATH, data file
      # locations), so the package holds a /usr/local tree.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          cat > stage/usr/local/README-wsl.txt <<'TXT'
          MB-System with graphical tools, built for Ubuntu 22.04 (WSL2 on Windows 11).

          1. Install the libraries the programs need (inside WSL):
               sudo apt update
               sudo apt install gmt libgmt6 libgdal30 libproj22 libnetcdf19 \
                 libfftw3-double3 libtirpc3 libxm4 libxt6 libgl1 libglu1-mesa

          2. Unpack this archive into /usr/local and refresh the library cache:
               sudo tar -xzf mbsystem-linux-gui-ubuntu22.04.tar.gz -C /usr/local
               sudo ldconfig

          3. Run a graphical tool, e.g.:
               mbgrdviz
               mbedit
             On Windows 11 the windows open on the Windows desktop (WSLg).
          TXT
          tar -czf mbsystem-linux-gui-ubuntu22.04.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-linux-gui-ubuntu22.04
          path: mbsystem-linux-gui-ubuntu22.04.tar.gz
          if-no-files-found: error

  # Full macOS build including the Motif/X11 graphical tools, with Motif, X11
  # and Mesa (libGL/libGLU) from Homebrew, as build-utils/FindMotif.cmake and
  # FindOpenGL.cmake expect under /opt/homebrew.
  macos-gui:
    name: macOS with GUIs (Clang, arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install cmake ninja gmt gdal proj netcdf fftw \
            openmotif libx11 libxt mesa mesa-glu

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DbuildGUIs=ON \
            -DbuildOpenCV=OFF \
            -DbuildTRN=ON \
            -DbuildTests=OFF

      - name: Build
        run: cmake --build build-ci --parallel -- -k 0

      # Same /usr/local layout as the other Unix packages.
      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build-ci
          cat > stage/usr/local/README-macos.txt <<'TXT'
          MB-System with graphical tools for macOS on Apple Silicon (arm64).

          1. Install the libraries the programs need (Homebrew), and XQuartz,
             which displays the X11/Motif windows:
               brew install gmt gdal proj netcdf fftw openmotif libx11 libxt mesa mesa-glu
               brew install --cask xquartz
             Log out and back in once after installing XQuartz.

          2. Unpack this archive into /usr/local:
               sudo mkdir -p /usr/local
               sudo tar -xzf mbsystem-macos-gui-arm64.tar.gz -C /usr/local
             If macOS blocks the programs as downloaded from the internet:
               sudo xattr -dr com.apple.quarantine /usr/local/bin /usr/local/lib

          3. Run a graphical tool, e.g.:
               mbgrdviz
               mbedit
          TXT
          tar -czf mbsystem-macos-gui-arm64.tar.gz -C stage/usr/local .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbsystem-macos-gui-arm64
          path: mbsystem-macos-gui-arm64.tar.gz
          if-no-files-found: error
